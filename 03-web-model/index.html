<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Optimizador Cadena de Suministro Cítricos</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-4 text-center">
      <h1 class="text-xl font-bold text-gray-800">
        Optimizador Cadena de Suministro Cítricos
      </h1>
      <p class="text-sm text-gray-500 mt-0.5">
        Multi-objetivo: Costo · Emisiones · Empleo
      </p>
    </div>
  </header>

  <!-- Nav Tabs -->
  <nav class="bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-4 flex justify-center gap-1">
      <button class="tab-btn" data-tab="config">Config</button>
      <button class="tab-btn" data-tab="params">Parámetros</button>
      <button class="tab-btn" data-tab="lgp">LGP</button>
      <button class="tab-btn" data-tab="er">ER</button>
    </div>
  </nav>

  <!-- Main content -->
  <main class="max-w-5xl mx-auto px-4 py-6">

    <!-- ── Config ──────────────────────────────────────────────────────── -->
    <section id="tab-config">
      <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm max-w-md mx-auto">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Configuración del Solver</h2>

        <div class="flex items-center gap-3 mb-5">
          <span class="text-sm text-gray-600 font-medium">Solver activo:</span>
          <span id="solver-badge" class="solver-badge">…</span>
        </div>

        <div class="mb-4">
          <label for="solver-select" class="block text-sm font-medium text-gray-700 mb-1">
            Cambiar solver
          </label>
          <select
            id="solver-select"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
          >
            <option value="highs">highs</option>
            <option value="glpk">glpk</option>
            <option value="cbc">cbc</option>
            <option value="cplex">cplex</option>
          </select>
        </div>

        <button
          id="solver-btn"
          class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors"
        >
          Cambiar solver
        </button>
        <p id="solver-msg" class="feedback-ok" aria-live="polite"></p>
      </div>
    </section>

    <!-- ── Parámetros ──────────────────────────────────────────────────── -->
    <section id="tab-params" class="hidden">
      <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold text-gray-800">Parámetros del modelo</h2>
          <div class="flex items-center gap-2">
            <p id="params-msg" class="feedback-ok text-sm" aria-live="polite"></p>
            <button
              id="params-save-btn"
              class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors"
            >
              Guardar cambios
            </button>
            <button
              id="params-reset-btn"
              class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold px-4 py-2 rounded-lg transition-colors"
            >
              Restaurar defaults
            </button>
          </div>
        </div>
        <div id="params-container">
          <div class="spinner"></div>
        </div>
      </div>
    </section>

    <!-- ── LGP ────────────────────────────────────────────────────────── -->
    <section id="tab-lgp" class="hidden">
      <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
        <div class="flex items-center justify-between mb-5">
          <div>
            <h2 class="text-lg font-semibold text-gray-800">Programación por Metas Lexicográfica</h2>
            <p class="text-sm text-gray-500 mt-0.5">Prioridad: Costo → Emisiones → Empleo</p>
          </div>
          <button
            id="lgp-btn"
            class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-sm font-semibold px-5 py-2 rounded-lg transition-colors"
          >
            Ejecutar LGP
          </button>
        </div>
        <div id="lgp-result"></div>
      </div>
    </section>

    <!-- ── ER ─────────────────────────────────────────────────────────── -->
    <section id="tab-er" class="hidden">
      <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
        <div class="flex items-center justify-between mb-5">
          <div>
            <h2 class="text-lg font-semibold text-gray-800">Método Epsilon-Restricción</h2>
            <p class="text-sm text-gray-500 mt-0.5">Frontera Pareto: Costo vs Emisiones</p>
          </div>
          <div class="flex items-center gap-3">
            <div>
              <label for="er-steps" class="block text-xs font-medium text-gray-600 mb-1">
                Pasos (steps)
              </label>
              <input
                id="er-steps"
                type="number"
                value="5"
                min="2"
                max="50"
                class="w-20 border border-gray-300 rounded-lg px-2 py-1.5 text-sm text-center focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <button
              id="er-btn"
              class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-sm font-semibold px-5 py-2 rounded-lg transition-colors self-end"
            >
              Ejecutar ER
            </button>
          </div>
        </div>
        <div id="er-result"></div>
      </div>
    </section>

  </main>

  <script type="module" src="js/app.js"></script>

</body>
</html>
